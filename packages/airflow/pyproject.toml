[project]
name = "airflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vitormbesen" }
]
requires-python = ">=3.14"
dependencies = [
    "apache-airflow[postgres,standard, fab]>=3.2.2",
    "medallion-rag>=0.1.0",
]

[tool.uv.sources]
medallion-rag = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Tell setuptools NOT to treat dags/config folders as python packages
[tool.setuptools]
packages = []

