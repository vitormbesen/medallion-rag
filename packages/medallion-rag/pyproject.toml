[project]
name = "medallion-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vitormbesen" }
]
requires-python = ">=3.14"
dependencies = [
    "omegaconf>=2.3.1",
    "pydantic>=2.13.4",
    #"transformers<5.13.1",
    #"tokenizers>=0.23.1",
    "torch",
    "sentence-transformers",
    "pendulum>=3.2.0",
    "sqlalchemy>=2.0.51",
    "pgvector>=0.5.0",
    "langchain-text-splitters>=1.1.2",
    "psycopg2-binary>=2.9.12",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion_rag"]
