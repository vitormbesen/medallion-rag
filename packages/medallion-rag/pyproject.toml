[project]
name = "medallion-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vitormbesen" }
]
requires-python = ">=3.14"
dependencies = [
    "omegaconf>=2.3.1",
    "pydantic>=2.13.4",
    "transformers>=5.13.1",
    "torch",
    "sentence-transformers",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion_rag"]
